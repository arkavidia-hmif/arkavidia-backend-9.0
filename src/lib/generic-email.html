<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkavidia - {{title}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      style="
        width: 100%;
        border-spacing: 0;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
      "
    >
      <tr>
        <td align="center" style="padding: 0">
          <table
            role="presentation"
            style="width: 600px; border-spacing: 0; background-image: url('{{fe_url}}/images/email/Email.png'); background-size: cover; background-position: center; background-color: #1d1d1d; border-radius: 16px; overflow: hidden; margin: 0 auto;"
          >
            <!-- Header with background image -->
            <tr>
              <td align="center" style="padding: 40px 20px">
                <img
                  src="{{fe_url}}/images/email/Logo.png"
                  alt="Arkavidia Logo"
                  style="width: 120px; height: auto"
                />
              </td>
            </tr>
            <!-- Content -->
            <tr>
              <td style="padding: 0 15px 40px 15px">
                <table
                  role="presentation"
                  style="width: 100%; border-spacing: 0"
                >
                  <tr>
                    <td style="padding: 0">
                      <h2
                        style="
                          color: #ffffff;
                          font-size: 24px;
                          margin: 0 0 20px 0;
                          text-align: center;
                        "
                      >
                        {{title}}
                      </h2>
                      <p
                        style="
                          color: rgba(255, 255, 255, 0.8);
                          font-size: 16px;
                          line-height: 24px;
                          margin: 0 0 20px 0;
                          text-align: center;
                        "
                      >
                        {{message}}
                      </p>
                      {{#if errorList}}
                      <div
                        style="
                          background-color: rgba(255, 255, 255, 0.4);
                          border-radius: 4px;
                          padding: 10px;
                          margin: 0 0 20px 0;
                        "
                      >
                        <table
                          role="presentation"
                          style="
                            width: 100%;
                            border-spacing: 0;
                            background-color: rgba(255, 255, 255, 0.4);
                            border-radius: 4px;
                            padding: 10px;
                            margin: 0;
                          "
                        >
                          <thead>
                            <tr>
                              <th
                                style="
                                  padding: 8px;
                                  text-align: left;
                                  color: #000;
                                "
                              >
                                Error
                              </th>
                              <th
                                style="
                                  padding: 8px;
                                  text-align: left;
                                  color: #000;
                                "
                              >
                                Detail
                              </th>
                            </tr>
                          </thead>
                          <tbody>
                            {{#each errorList}}
                            <tr>
                              <td style="padding: 8px; color: #00000090">
                                {{this.title}}
                              </td>
                              <td style="padding: 8px; color: #00000090">
                                {{this.error}}
                              </td>
                            </tr>
                            {{/each}}
                          </tbody>
                        </table>
                      </div>
                      {{/if}}
                    </td>
                  </tr>
                  {{#if link}}
                  <tr>
                    <td align="center" style="padding: 0; text-align: center">
                      <a
                        href="{{link}}"
                        style="
                          background: linear-gradient(135deg, #60a5fa, #8b5cf6);
                          color: #ffffff;
                          text-decoration: none;
                          padding: 15px 30px;
                          border-radius: 8px;
                          font-weight: bold;
                          display: inline-block;
                          text-align: center;
                          mso-padding-alt: 0;
                          text-underline-color: #60a5fa;
                        "
                      >
                        <!--[if mso]>
                          <i
                            style="
                              letter-spacing: 25px;
                              mso-font-width: -100%;
                              mso-text-raise: 30pt;
                            "
                            >&nbsp;</i
                          >
                        <![endif]-->
                        <span style="mso-text-raise: 15pt; text-align: center"
                          >Go to</span
                        >
                        <!--[if mso]>
                          <i style="letter-spacing: 25px; mso-font-width: -100%"
                            >&nbsp;</i
                          >
                        <![endif]-->
                      </a>
                    </td>
                  </tr>
                  <!-- New Copy Link Section -->
                  <tr>
                    <td style="padding: 30px 0 0 0">
                      <p
                        style="
                          color: rgba(255, 255, 255, 0.8);
                          font-size: 14px;
                          line-height: 20px;
                          margin: 0 0 10px 0;
                          text-align: center;
                        "
                      >
                        Atau salin link berikut:
                      </p>
                      <p
                        style="
                          background-color: rgba(255, 255, 255, 0.1);
                          border-radius: 4px;
                          padding: 10px;
                          margin: 0;
                          word-break: break-all;
                        "
                      >
                        <a
                          href="{{link}}"
                          style="
                            color: #60a5fa;
                            text-decoration: none;
                            font-size: 14px;
                            line-height: 20px;
                          "
                        >
                          {{link}}
                        </a>
                      </p>
                    </td>
                  </tr>
                  {{/if}}
                </table>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 30px;
                  background: #151515;
                  text-align: center;
                  font-size: 12px;
                  color: rgba(255, 255, 255, 0.5);
                "
              >
                <p style="margin: 0; font-size: 14px; line-height: 20px">
                  &copy; 2025 Arkavidia. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
